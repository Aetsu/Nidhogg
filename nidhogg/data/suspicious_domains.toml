# Suspicious domain categories for the Nidhogg domain classifier.
# Each section lists domains (or TLDs) associated with a threat category.
# Subdomain matching is automatic: an entry "bit.ly" also matches "x.bit.ly".

[shortener]
domains = [
    "bit.ly",
    "tinyurl.com",
    "t.co",
    "is.gd",
    "ow.ly",
    "goo.gl",
    "buff.ly",
    "ift.tt",
    "j.mp",
    "rb.gy",
    "shorturl.at",
    "cutt.ly",
    "tiny.cc",
    "t2m.io",
    "clck.ru",
    "shorte.st",
    "adf.ly",
    "bc.vc",
]

