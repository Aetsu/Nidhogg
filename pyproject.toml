[project]
name = "nidhogg"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # conflicts with D211 (no-blank-line-before-class)
    "D213",    # conflicts with D212 (multi-line-summary-second-line)
    "COM812",  # trailing comma — conflicts with formatter
    "ISC001",  # implicit string concat — conflicts with formatter
    "FIX002",  # line contains FIXME
    "TD002",   # missing author in TODO
    "TD003",   # missing issue link in TODO
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "PLR2004", "PLR0913", "TRY003", "EM101", "TC003", "FBT001", "FBT002", "E501", "PLC0415", "PT019"]
"tests/fixtures/**" = ["INP001", "S307", "PTH111"]

[tool.mypy]
python_version = "3.14"
files = ["nidhogg"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
